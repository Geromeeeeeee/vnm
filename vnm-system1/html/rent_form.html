    <script>
    // Calculate minimum date: either tomorrow or after customer's existing rental
    let minDate = new Date();
    minDate.setDate(minDate.getDate() + 1); // Default: tomorrow
    
    if (typeof CUSTOMER_MIN_DATE !== 'undefined' && CUSTOMER_MIN_DATE) {
        const customerMinDate = new Date(CUSTOMER_MIN_DATE);
        // Use whichever is later: tomorrow or the customer's min date
        if (customerMinDate > minDate) {
            minDate = customerMinDate;
        }
    }
    
    flatpickr("#pickup", {
        dateFormat: "Y-m-d",
        minDate: minDate,
        disable: typeof DISABLED_DATES !== 'undefined' ? DISABLED_DATES : [],
        locale: { firstDayOfWeek: 1 },
        onChange: function(selectedDates, dateStr, instance) {
            // Trigger return date calculation when pickup date changes
            if (typeof window.calculateReturnDate === 'function') {
                window.calculateReturnDate();
            }
        }
    });
</script>
